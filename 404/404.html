<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>صفحه پیدا نشد | Jewelry</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./404.css">

</head>


<body>


    <main class="error-page">


        <!-- Background decorations -->

        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>


        <div class="error-container">


            <!-- Jewelry decoration -->

            <div class="jewelry-decoration jewelry-1">
                ♢
            </div>

            <div class="jewelry-decoration jewelry-2">
                ✦
            </div>

            <div class="jewelry-decoration jewelry-3">
                ◇
            </div>


            <!-- 404 -->

            <div class="error-number">

                <span>4</span>

                <div class="error-ring">

                    <div class="ring-circle"></div>

                    <div class="ring-diamond">
                        ◆
                    </div>

                </div>

                <span>4</span>

            </div>


            <!-- Content -->

            <div class="error-content">

                <span class="error-label">
                    صفحه مورد نظر پیدا نشد
                </span>


                <h1>
                    انگار این صفحه
                    <br>
                    گم شده!
                </h1>


                <p>
                    صفحه‌ای که به دنبال آن هستید وجود ندارد
                    یا ممکن است حذف شده باشد.
                </p>


                <!-- Buttons -->

                <div class="error-actions">

                    <a
                        href="/"
                        class="btn home-btn">

                        بازگشت به خانه

                    </a>


                    <button
                        onclick="history.back()"
                        class="btn back-btn">

                        صفحه قبل

                    </button>

                </div>


                <!-- Helpful links -->

                <div class="quick-links">

                    <span>
                        شاید این صفحات به کمکتان بیایند:
                    </span>


                    <div class="links">

                        <a href="/products">
                            محصولات
                        </a>

                        <a href="/categories">
                            دسته‌بندی‌ها
                        </a>

                        <a href="/contact">
                            تماس با ما
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


</body>

</html>
