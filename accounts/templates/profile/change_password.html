{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور | Persian Jewelry</title>
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="profile-page change-password-page">
    <!-- Background -->
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Sidebar (همین قبلی) -->
    <aside class="profile-sidebar">... (کپی از فایل قبلی profile.html تا <div class="sidebar-bottom">) ...</aside>

    <main class="profile-main">
        <header class="profile-header">
            <div>
                <span class="header-label">SECURITY</span>
                <h1>تغییر رمز عبور</h1>
                <p>رمز عبور جدید خود را وارد کنید</p>
            </div>
        </header>

        <section class="change-password-form">
            <div class="change-card">
                <form method="post">
                    {% csrf_token %}

                    <div class="input-group">
                        <label>رمز عبور فعلی</label>
                        <input type="password" name="old_password" placeholder="رمز فعلی" required>
                    </div>

                    <div class="input-group">
                        <label>رمز عبور جدید</label>
                        <input type="password" name="new_password1" placeholder="رمز جدید" required>
                    </div>

                    <div class="input-group">
                        <label>تکرار رمز جدید</label>
                        <input type="password" name="new_password2" placeholder="تکرار رمز جدید" required>
                    </div>

                    <button type="submit" class="change-btn">تغییر رمز عبور</button>
                    <a href="{% url 'accounts:profile' %}" class="back-btn">انصراف</a>
                </form>
            </div>
        </section>
    </main>

</div>

<script src="{% static 'js/profile.js' %}"></script>

</body>
</html>
