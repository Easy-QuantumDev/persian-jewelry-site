<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <link rel="stylesheet" href="./contact.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
</head>

<body>
    <div class="container">


        <div class="contact-sec"  data-aos="fade-down" data-aos-duration="1900" >





            <div class="left-contatct-sec">

                <span class="contact-title">Contact Us</span>
                <h1 class="left-content-header">با ما در ارتباط باشید</h1>
                <p>ما همیشه اماده پاسخگویی به سوالات و پیشنهادات و سفارش های شما هستیم واز طریق راه های زیر با ما در
                    ارتباط باشید</p>
                <div class="contact-options-sec">


                    <div class="info-main-sec">

                        <img src="./icons/phone.svg" alt="">


                        <div class="info-sec">
                            <h6>تلفن تماس</h6>
                            <span>09153274764</span>
                        </div>

                    </div>

                    <div class="info-main-sec">

                        <img src="./icons/mai.svg" alt="">
                        <div class="info-sec">
                            <h6>ایمیل</h6>
                            <span>info@gmail.com</span>


                        </div>

                    </div>

                    <div class="info-main-sec">

                        <img src="./icons/location.svg" alt="">

                        <div class="info-sec">
                            <h6>آدرس فروشگاه</h6>
                            <span>مشهد , سیدرضی 16</span>

                        </div>

                    </div>


                    <div class="info-main-sec">

                        <img src="./icons/support.svg" alt="">
                        <div class="info-sec">
                            <h6>ساعات پاسخگویی</h6>
                            <span>شنبه تا پنجشنبه 9 تا 18</span>


                        </div>

                    </div>




                </div>
            </div>





            <div class="center-contatct-sec">

                <form action="" method="post">
                    <h4>برای ما پیغام بگذارید</h4>
                    <input type="text" placeholder="نام و نام خانوادگی">

                    <input type="text" placeholder="ایمیل">

                    <input type="text" placeholder="شماره تلفن">

                    <textarea name="" placeholder="پیام شما " id=""></textarea>
                    <button type="submit" class="btn-form-content">
                        <span>
                            <img src="./icons/send.svg" alt="">
                            ارسال پیام
                        </span>
                    </button>
                </form>




            </div>




            <div class="right-contatct-sec">


                <div id="map"></div>



            </div>




        </div>





    </div>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init()
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./contact.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
